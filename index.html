
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بطولة فارس التفاعلية</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #e94560;
            margin-bottom: 30px;
            text-shadow: 0 0 10px rgba(233, 69, 96, 0.5);
        }

        .tournament-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 50px;
            background: #16213e;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .round {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            height: 300px;
        }

        .matchup {
            display: flex;
            flex-direction: column;
            background: #0f3460;
            border: 2px solid #e94560;
            border-radius: 8px;
            overflow: hidden;
            width: 180px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        .team {
            padding: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: bold;
        }

        .team:hover {
            background-color: #e94560;
            color: #fff;
        }

        .team:first-child {
            border-bottom: 1px solid #16213e;
        }

        .winner-box {
            border: 2px dashed #4ecc71;
            background: #1b4d3e;
            color: #4ecc71;
            cursor: default;
        }

        .winner-box:hover {
            background: #1b4d3e;
            color: #4ecc71;
        }
    </style>
</head>
<body>

    <h1>🏆 بطولة فارس التفاعلية</h1>

    <div class="tournament-container">
        
‎        <!-- نصف النهائي -->
        <div class="round">
‎            <!-- المباراة الأولى -->
            <div class="matchup">
                <div class="team" onclick="advanceTeam(this, 'm1')">الفريق أ</div>
                <div class="team" onclick="advanceTeam(this, 'm1')">الفريق ب</div>
            </div>
‎            <!-- المباراة الثانية -->
            <div class="matchup">
                <div class="team" onclick="advanceTeam(this, 'm2')">الفريق ج</div>
                <div class="team" onclick="advanceTeam(this, 'm2')">الفريق د</div>
            </div>
        </div>

‎        <!-- النهائي -->
        <div class="round">
            <div class="matchup">
                <div class="team" id="final-t1" onclick="advanceTeam(this, 'champion')">بانتظار الفائز 1</div>
                <div class="team" id="final-t2" onclick="advanceTeam(this, 'champion')">بانتظار الفائز 2</div>
            </div>
        </div>

‎        <!-- البطل -->
        <div class="round">
            <div class="matchup winner-box">
                <div class="team" id="champion">👑 البطل</div>
            </div>
        </div>

    </div>

    <script>
        function advanceTeam(element, match) {
            const teamName = element.innerText;
            
‎            // تجنب نقل النصوص الافتراضية
            if (teamName.includes("بانتظار") || teamName.includes("البطل")) return;

            if (match === 'm1') {
                document.getElementById('final-t1').innerText = teamName;
            } else if (match === 'm2') {
                document.getElementById('final-t2').innerText = teamName;
            } else if (match === 'champion') {
                document.getElementById('champion').innerText = "👑 " + teamName;
            }
        }
    </script>
